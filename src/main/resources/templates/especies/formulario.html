<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${especie.id} == null ? 'Nueva Especie' : 'Editar Especie'">Formulario Especie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 th:text="${especie.id} == null ? 'Nueva Especie' : 'Editar Especie'"></h3>
            </div>
            <div class="card-body">
                <form th:action="@{/especies/guardar}" th:object="${especie}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Panda gigante">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Reino:</label>
                        <input type="text" th:field="*{reino}" class="form-control" placeholder="Ej: Animalia">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Habitat:</label>
                        <input type="text" th:field="*{habitat}" class="form-control" placeholder="Ej: Bosque">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" th:field="*{peligro}" class="form-check-input" id="peligroCheck">
                        <label class="form-check-label" for="peligroCheck">En peligro de extincion</label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/especies}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
