<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Especies - Granja/Zoo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Especies</h1>
            <a th:href="@{/especies/nuevo}" class="btn btn-primary">+ Nueva Especie</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Reino</th>
                        <th>Habitat</th>
                        <th>En Peligro</th>
                        <th>Cantidad Animales</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${especies}">
                        <td th:text="${e.id}">...</td>
                        <td th:text="${e.nombre}">...</td>
                        <td th:text="${e.reino}">...</td>
                        <td th:text="${e.habitat}">...</td>
                        <td>
                            <span th:if="${e.peligro}" class="badge bg-danger">Si</span>
                            <span th:unless="${e.peligro}" class="badge bg-success">No</span>
                        </td>
                        <td th:text="${e.animales.size()}">0</td>
                        <td>
                            <a th:href="@{/especies/editar/{id}(id=${e.id})}" class="btn btn-sm btn-warning">Editar</a>
                            <a th:href="@{/especies/eliminar/{id}(id=${e.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Eliminar esta especie?')">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${especies.isEmpty()}">
                        <td colspan="7" class="text-center text-muted">No hay especies registradas</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a th:href="@{/animales}" class="btn btn-secondary">Ver Animales</a>
        </div>
    </div>
</body>
</html>
