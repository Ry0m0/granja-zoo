<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Animales - Granja/Zoo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Animales</h1>
            <a th:href="@{/animales/nuevo}" class="btn btn-primary">+ Nuevo Animal</a>
        </div>

        <div class="card mb-3">
            <div class="card-header bg-secondary text-white">Filtros</div>
            <div class="card-body">
                <form method="get" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Sexo:</label>
                        <select name="sexo" class="form-select">
                            <option value="">Todos</option>
                            <option value="M" th:selected="${sexoSeleccionado == 'M'}">Macho (M)</option>
                            <option value="H" th:selected="${sexoSeleccionado == 'H'}">Hembra (H)</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Recinto:</label>
                        <input type="text" name="recinto" class="form-control" th:value="${recintoSeleccionado}" placeholder="Ej: Zona Norte">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">Filtrar</button>
                        <a th:href="@{/animales}" class="btn btn-secondary">Reset</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Sexo</th>
                        <th>Especie</th>
                        <th>Fecha Nac.</th>
                        <th>Peso(kg)</th>
                        <th>Recinto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${animales}">
                        <td th:text="${a.id}">...</td>
                        <td th:text="${a.nombre}">...</td>
                        <td th:text="${a.sexo}">...</td>
                        <td th:text="${a.especie != null ? a.especie.nombre : 'Sin especie'}">...</td>
                        <td th:text="${#temporals.format(a.fechaNacimiento, 'dd/MM/yyyy')}">...</td>
                        <td th:text="${a.peso}">...</td>
                        <td th:text="${a.recinto}">...</td>
                        <td>
                            <a th:href="@{/animales/editar/{id}(id=${a.id})}" class="btn btn-sm btn-warning">Editar</a>
                            <a th:href="@{/animales/eliminar/{id}(id=${a.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Eliminar este animal?')">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${animales.isEmpty()}">
                        <td colspan="8" class="text-center text-muted">No hay animales registrados</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a th:href="@{/especies}" class="btn btn-secondary">Ver Especies</a>
        </div>
    </div>
</body>
</html>
