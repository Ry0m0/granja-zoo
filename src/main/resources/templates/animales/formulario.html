<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${animal.id} == null ? 'Nuevo Animal' : 'Editar Animal'">Formulario Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 th:text="${animal.id} == null ? 'Nuevo Animal' : 'Editar Animal'"></h3>
            </div>
            <div class="card-body">
                <form th:action="@{/animales/guardar}" th:object="${animal}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Luna">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sexo:</label>
                        <select th:field="*{sexo}" class="form-select">
                            <option value="">Seleccionar...</option>
                            <option value="M">Macho (M)</option>
                            <option value="H">Hembra (H)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Nacimiento:</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Peso (kg):</label>
                        <input type="number" step="0.01" th:field="*{peso}" class="form-control" placeholder="Ej: 85.5">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Recinto:</label>
                        <input type="text" th:field="*{recinto}" class="form-control" placeholder="Ej: Zona Norte">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Especie:</label>
                        <select th:field="*{especie.id}" class="form-select">
                            <option value="">-- Sin especie --</option>
                            <option th:each="e : ${especies}" th:value="${e.id}" th:text="${e.nombre}"></option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/animales}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
